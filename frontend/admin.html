<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bambo Admin Panel</title>
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- SEKTORI I LOGIN-IT -->
  <div id="loginSection" class="login-container">
    <div class="admin-card">
      <h2 class="section-title admin-title-center">Admin Login</h2>
      <div class="admin-form-group">
        <label for="adminPassword">Fjalëkalimi i Panelit</label>
        <input type="password" id="adminPassword" class="admin-input" placeholder="Fut fjalëkalimin...">
        <span id="loginError" class="error-text hidden">Fjalëkalim i gabuar!</span>
      </div>
      <button class="admin-btn" onclick="handleLogin()">Hyr në Panel</button>
    </div>
  </div>

  <!-- PANELI KRYESOR -->
  <div id="adminPanelSection" class="admin-wrapper hidden">
    <div class="admin-header-row">
      <h2 class="section-title" id="formTitle">Shto Produkt të Ri</h2>
      <button class="footer-btn admin-logout-btn" onclick="handleLogout()">Dil (Logout)</button>
    </div>

    <!-- Formulari i Shtimit/Editimit të Produktit -->
    <div class="admin-card">
      <form id="addProductForm" onsubmit="submitProduct(event)">
        
        <!-- Emri në 3 Gjuhë -->
        <h3 class="admin-subtitle">Emri i Produktit</h3>
        <div class="admin-lang-grid">
          <div class="admin-form-group">
            <label>🇦🇱 Shqip</label>
            <input type="text" id="prodNameSq" class="admin-input" required placeholder="p.sh. Pizza Margherita">
          </div>
          <div class="admin-form-group">
            <label>🇬🇧 English</label>
            <input type="text" id="prodNameEn" class="admin-input" placeholder="p.sh. Margherita Pizza">
          </div>
          <div class="admin-form-group">
            <label>🇮🇹 Italiano</label>
            <input type="text" id="prodNameIt" class="admin-input" placeholder="p.sh. Pizza Margherita">
          </div>
        </div>

        <!-- Kategoritë me Checkbox dhe Butonin + -->
        <div class="admin-form-group" style="margin-top: 15px;">
          <div class="admin-category-header">
            <label style="margin: 0;">Zgjidh Kategoritë</label>
            <button type="button" class="admin-add-cat-btn" onclick="openCategoryModal()">+ Shto Kategori të Re</button>
          </div>
          <div id="categoriesCheckboxContainer" class="admin-checkbox-list">
            <!-- Këtu ngarkohen kategoritë dinamikisht si checkbox-e -->
          </div>
        </div>

        <!-- Çmimet -->
        <div class="admin-price-row" style="margin-top: 15px;">
          <div class="admin-form-group flex-1">
            <label for="prodPriceNormal">Çmimi Normal (ALL)</label>
            <input type="number" id="prodPriceNormal" class="admin-input" required placeholder="p.sh. 600">
          </div>
          <div class="admin-form-group flex-1">
            <label for="prodPriceFamily">Çmimi Familjar (Opsionale)</label>
            <input type="number" id="prodPriceFamily" class="admin-input" placeholder="p.sh. 1200">
          </div>
        </div>

        <!-- Përshkrimi në 3 Gjuhë -->
        <h3 class="admin-subtitle" style="margin-top: 15px;">Përshkrimi i Produktit</h3>
        <div class="admin-lang-grid">
          <div class="admin-form-group">
            <label>🇦🇱 Shqip</label>
            <textarea id="prodDescSq" class="admin-textarea" placeholder="Përbërësit në shqip..."></textarea>
          </div>
          <div class="admin-form-group">
            <label>🇬🇧 English</label>
            <textarea id="prodDescEn" class="admin-textarea" placeholder="Ingredients in english..."></textarea>
          </div>
          <div class="admin-form-group">
            <label>🇮🇹 Italiano</label>
            <textarea id="prodDescIt" class="admin-textarea" placeholder="Ingredienti in italiano..."></textarea>
          </div>
        </div>

        <!-- Seksioni i Garniturave (Garnishes) në 3 Gjuhë -->
        <div class="admin-form-group" style="margin-top: 20px;">
          <div class="admin-category-header">
            <label style="margin: 0;">Garniturat (Opsionale)</label>
            <button type="button" class="admin-add-cat-btn" onclick="addGarnishField()">+ Shto Garniturë</button>
          </div>
          <div id="garnishListContainer" class="admin-garnish-container">
            <!-- Këtu shtohen fushat dinamikisht me JavaScript -->
          </div>
        </div>

        <!-- Upload Imazhi -->
        <div class="admin-form-group" style="margin-top: 20px;">
          <label for="prodImageFile">Ngarko Imazhin (Foto)</label>
          <!--
            FIX: u hoq "required" nga këtu. Më parë ishte gjithmonë e detyrueshme,
            kështu që editimi i një produkti pa zgjedhur imazh të ri e bllokonte
            submit-in në heshtje (browser-i s'linte fare të thirrej submitProduct()).
            Tani e detyrueshme vetëm kur SHTON produkt të ri — kontrollohet
            dinamikisht nga js/admin.js (resetAdminForm / startEditingProduct).
          -->
          <input type="file" id="prodImageFile" class="admin-input" accept="image/*" style="padding: 8px;">
          <span id="imageHint" class="error-text hidden" style="color: var(--text-muted);">
            Lëre bosh nëse nuk do ta ndryshosh imazhin ekzistues.
          </span>
        </div>

        <button type="submit" id="adminSubmitBtn" class="admin-btn" style="margin-top: 15px;">Shto Produktin</button>
        <button type="button" id="cancelEditBtn" class="admin-cancel-edit-btn hidden" onclick="resetAdminForm()">Anulo Editimin</button>
      </form>
    </div>

    <!-- Lista e Produkteve Ekzistuese -->
    <h2 class="section-title">Produktet Ekzistuese</h2>
    <div class="admin-card">
      <div id="adminProductsList" class="products-list"></div>
    </div>
  </div>

  <!-- MODAL: Paneli për Krijimin e Kategorisë së Re në 3 Gjuhë -->
  <div id="categoryModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="modal-title">Shto Kategori të Re</h3>
      <p class="modal-subtitle">Plotëso emrin e kategorisë në të gjitha gjuhët.</p>
      
      <div class="admin-form-group">
        <label>🇦🇱 Emri (Shqip)</label>
        <input type="text" id="newCatSq" class="admin-input" placeholder="p.sh. Pica">
      </div>
      <div class="admin-form-group">
        <label>🇬🇧 Emri (English)</label>
        <input type="text" id="newCatEn" class="admin-input" placeholder="p.sh. Pizzas">
      </div>
      <div class="admin-form-group">
        <label>🇮🇹 Emri (Italiano)</label>
        <input type="text" id="newCatIt" class="admin-input" placeholder="p.sh. Pizze">
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="button" class="admin-btn" style="background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);" onclick="closeCategoryModal()">Anulo</button>
        <button type="button" class="admin-btn" onclick="saveNewCategory()">Krijo Kategorinë</button>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
