<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bambo Admin Panel</title>
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- SEKTORI I LOGIN-IT -->
  <div id="loginSection" class="login-container">
    <div class="admin-card">
      <h2 class="section-title admin-title-center">Admin Login</h2>
      <form id="loginForm">
        <div class="admin-form-group">
          <label for="adminPassword">Fjalëkalimi i Panelit</label>
          <div class="admin-password-wrapper">
            <input type="password" id="adminPassword" class="admin-input" required placeholder="Fut fjalëkalimin...">
            <button type="button" class="admin-eye-btn toggle-password-btn" data-target="adminPassword">👁️</button>
          </div>
          <span id="loginError" class="error-text hidden">Fjalëkalim i gabuar!</span>
        </div>
        <button type="submit" class="admin-btn">Hyr në Panel</button>
      </form>
    </div>
  </div>

  <!-- PANELI KRYESOR -->
  <div id="adminPanelSection" class="admin-wrapper hidden">
    <div class="admin-header-row">
      <h2 class="section-title" id="formTitle">Shto Produkt të Ri</h2>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button type="button" id="togglePasswordSecBtn" class="admin-btn" style="width: auto; padding: 10px 16px; font-size: 0.85rem; background: var(--card-bg); color: var(--accent-gold); border: 1px solid var(--accent-gold);">Ndrysho Fjalëkalimin</button>
        <button type="button" id="logoutBtn" class="footer-btn admin-logout-btn">Dil (Logout)</button>
      </div>
    </div>

    <!-- SEKTORI I FSHEHUR PËR NDRYSHIMIN E FJALËKALIMIT -->
    <div id="passwordSectionCard" class="admin-card hidden">
      <h3 class="admin-subtitle">Ndrysho Fjalëkalimin e Adminit</h3>
      <form id="changePasswordForm">
        <div class="admin-form-group">
          <label for="currentPassword">Fjalëkalimi Aktual</label>
          <div class="admin-password-wrapper">
            <input type="password" id="currentPassword" class="admin-input" required placeholder="Fjalëkalimi aktual...">
            <button type="button" class="admin-eye-btn toggle-password-btn" data-target="currentPassword">👁️</button>
          </div>
        </div>
        <div class="admin-form-group">
          <label for="newPassword">Fjalëkalimi i Ri (Min. 6 karaktere)</label>
          <div class="admin-password-wrapper">
            <input type="password" id="newPassword" class="admin-input" required placeholder="Fjalëkalimi i ri...">
            <button type="button" class="admin-eye-btn toggle-password-btn" data-target="newPassword">👁️</button>
          </div>
        </div>
        <div class="admin-form-group">
          <label for="confirmPassword">Konfirmo Fjalëkalimin e Ri</label>
          <div class="admin-password-wrapper">
            <input type="password" id="confirmPassword" class="admin-input" required placeholder="Përsërit fjalëkalimin e ri...">
            <button type="button" class="admin-eye-btn toggle-password-btn" data-target="confirmPassword">👁️</button>
          </div>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
          <button type="submit" class="admin-btn" style="flex: 1;">Ruaj Fjalëkalimin</button>
          <button type="button" id="cancelPasswordSecBtn" class="admin-btn" style="flex: 1; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);">Anulo</button>
        </div>
      </form>
    </div>

    <!-- Formulari i Shtimit/Editimit të Produktit -->
    <div class="admin-card">
      <form id="addProductForm">
        
        <h3 class="admin-subtitle">Emri i Produktit</h3>
        <div class="admin-lang-grid">
          <div class="admin-form-group">
            <label>🇦🇱 Shqip</label>
            <input type="text" id="prodNameSq" class="admin-input" required placeholder="p.sh. Pizza Margherita">
          </div>
          <div class="admin-form-group">
            <label>🇬🇧 English</label>
            <input type="text" id="prodNameEn" class="admin-input" placeholder="p.sh. Margherita Pizza">
          </div>
          <div class="admin-form-group">
            <label>🇮🇹 Italiano</label>
            <input type="text" id="prodNameIt" class="admin-input" placeholder="p.sh. Pizza Margherita">
          </div>
        </div>

        <div class="admin-form-group" style="margin-top: 15px;">
          <div class="admin-category-header">
            <label style="margin: 0;">Zgjidh Kategoritë</label>
            <button type="button" id="openCatModalBtn" class="admin-add-cat-btn">+ Shto Kategori të Re</button>
          </div>
          <div id="categoriesCheckboxContainer" class="admin-checkbox-list"></div>
        </div>

        <div class="admin-price-row" style="margin-top: 15px;">
          <div class="admin-form-group flex-1">
            <label for="prodPriceNormal">Çmimi Normal (ALL)</label>
            <input type="number" id="prodPriceNormal" class="admin-input" required placeholder="p.sh. 600">
          </div>
          <div class="admin-form-group flex-1">
            <label for="prodPriceFamily">Çmimi Familjar (Opsionale)</label>
            <input type="number" id="prodPriceFamily" class="admin-input" placeholder="p.sh. 1200">
          </div>
        </div>

        <h3 class="admin-subtitle" style="margin-top: 15px;">Përshkrimi i Produktit</h3>
        <div class="admin-lang-grid">
          <div class="admin-form-group">
            <label>🇦🇱 Shqip</label>
            <textarea id="prodDescSq" class="admin-textarea" placeholder="Përbërësit në shqip..."></textarea>
          </div>
          <div class="admin-form-group">
            <label>🇬🇧 English</label>
            <textarea id="prodDescEn" class="admin-textarea" placeholder="Ingredients in english..."></textarea>
          </div>
          <div class="admin-form-group">
            <label>🇮🇹 Italiano</label>
            <textarea id="prodDescIt" class="admin-textarea" placeholder="Ingredienti in italiano..."></textarea>
          </div>
        </div>

        <div class="admin-form-group" style="margin-top: 20px;">
          <div class="admin-category-header">
            <label style="margin: 0;">Garniturat (Opsionale)</label>
            <button type="button" id="addGarnishBtn" class="admin-add-cat-btn">+ Shto Garniturë</button>
          </div>
          <div id="garnishListContainer" class="admin-garnish-container"></div>
        </div>

        <div class="admin-form-group" style="margin-top: 20px;">
          <label for="prodImageFile">Ngarko Imazhin (Foto)</label>
          <input type="file" id="prodImageFile" class="admin-input" accept="image/*" style="padding: 8px;">
          <span id="imageHint" class="error-text hidden" style="color: var(--text-muted);">
            Lëre bosh nëse nuk do ta ndryshosh imazhin ekzistues.
          </span>
        </div>

        <button type="submit" id="adminSubmitBtn" class="admin-btn" style="margin-top: 15px;">Shto Produktin</button>
        <button type="button" id="cancelEditBtn" class="admin-cancel-edit-btn hidden">Anulo Editimin</button>
      </form>
    </div>

    <h2 class="section-title">Produktet Ekzistuese</h2>
    <div class="admin-card">
      <div id="adminProductsList" class="products-list"></div>
    </div>
  </div>

  <!-- MODAL: Paneli për Krijimin e Kategorisë së Re -->
  <div id="categoryModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="modal-title">Shto Kategori të Re</h3>
      <p class="modal-subtitle">Plotëso emrin e kategorisë në të gjitha gjuhët.</p>
      
      <div class="admin-form-group">
        <label>🇦🇱 Emri (Shqip)</label>
        <input type="text" id="newCatSq" class="admin-input" placeholder="p.sh. Pica">
      </div>
      <div class="admin-form-group">
        <label>🇬🇧 Emri (English)</label>
        <input type="text" id="newCatEn" class="admin-input" placeholder="p.sh. Pizzas">
      </div>
      <div class="admin-form-group">
        <label>🇮🇹 Emri (Italiano)</label>
        <input type="text" id="newCatIt" class="admin-input" placeholder="p.sh. Pizze">
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="button" id="closeCatModalBtn" class="admin-btn" style="background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);">Anulo</button>
        <button type="button" id="saveCatBtn" class="admin-btn">Krijo Kategorinë</button>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
